<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181a26"/>
      <stop offset="100%" stop-color="#07080b"/>
    </radialGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- Escudo / D20 Geométrico Estilizado -->
  <g filter="url(#glow)">
    <polygon points="256,64 430,164 430,348 256,448 82,348 82,164" fill="none" stroke="url(#grad)" stroke-width="16" stroke-linejoin="round"/>
    <polygon points="256,120 380,210 330,370 182,370 132,210" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="8" stroke-linejoin="round"/>
    <line x1="256" y1="64" x2="256" y2="448" stroke="url(#grad)" stroke-width="8" stroke-opacity="0.5"/>
    <line x1="82" y1="164" x2="430" y2="348" stroke="url(#grad)" stroke-width="8" stroke-opacity="0.4"/>
    <line x1="82" y1="348" x2="430" y2="164" stroke="url(#grad)" stroke-width="8" stroke-opacity="0.4"/>
    <!-- Ícone Central: Dado D20 / Estrela Arcana -->
    <circle cx="256" cy="256" r="32" fill="url(#grad)"/>
    <polygon points="256,200 272,240 312,256 272,272 256,312 240,272 200,256 240,240" fill="#ffffff"/>
  </g>
</svg>
